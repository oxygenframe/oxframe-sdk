[package]
name = "oxframe-examples"
description = "Example scenes; also used by the docs, the playground gallery and acceptance tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
oxframe = { workspace = true, features = ["unstable-node-api", "video", "icons", "3d"] }
# Only for synthesizing the `one_shot` voice again; the committed `tts/`
# cache is used without them.
base64 = { version = "0.23.1", optional = true }
dotenvy = { version = "0.15.7", optional = true }
serde_json = { workspace = true, optional = true }
ureq = { version = "2", features = ["json"], optional = true }

[features]
elevenlabs = ["dep:base64", "dep:dotenvy", "dep:serde_json", "dep:ureq"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "seek"
harness = false

[lints]
workspace = true
