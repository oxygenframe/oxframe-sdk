name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: wasm32-unknown-unknown }
      - name: CHANGELOG.md has a section for this version
        run: grep -q "^## ${GITHUB_REF_NAME#v}\( \|$\)" CHANGELOG.md
      - name: Tag matches the workspace version
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - run: cargo test --workspace --locked
      # `--workspace` publishes in dependency order and skips publish = false.
      - name: Publish crates
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: cargo publish --workspace --locked
      # npm needs the @oxframe scope and an NPM_TOKEN; enable with the
      # repository variable PUBLISH_NPM=true once they exist.
      - name: Build @oxframe/protocol (same version)
        if: vars.PUBLISH_NPM == 'true'
        run: |
          cargo test -p oxframe-protocol --features ts
          v="${GITHUB_REF_NAME#v}"
          mkdir -p npm/src && cp -r crates/oxframe-protocol/bindings npm/src/generated
          cat > npm/package.json <<JSON
          {"name":"@oxframe/protocol","version":"$v","type":"module","license":"MIT OR Apache-2.0",
           "repository":"https://github.com/oxygenframe/oxframe-sdk","exports":{".":"./src/index.ts"}}
          JSON
          printf 'export * from "./generated/Command";\nexport * from "./generated/Event";\n' > npm/src/index.ts
      - uses: actions/setup-node@v7
        if: vars.PUBLISH_NPM == 'true'
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: npm publish --provenance --access public
        if: vars.PUBLISH_NPM == 'true'
        working-directory: npm
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      # Release notes are the version's CHANGELOG.md section.
      - name: GitHub release
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md
        env: { GH_TOKEN: "${{ github.token }}" }
