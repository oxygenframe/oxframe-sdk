[package]
name = "oxframe-2d"
description = "2D scene graph and nodes for oxframe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/oxframe-2d"

[package.metadata.docs.rs]
features = ["math"]

[dependencies]
oxframe-core.workspace = true
oxframe-text.workspace = true
kurbo.workspace = true
image.workspace = true
usvg.workspace = true
taffy.workspace = true
oxframe-math = { workspace = true, optional = true }
# Custom WGSL: parsed by naga and run on the CPU (native and wasm).
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
libm = "0.2"

[features]
# `Math` nodes: formulas set by Typst (adds the Typst compiler and a 1.4 MB font).
math = ["dep:oxframe-math"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

[lints]
workspace = true

[dev-dependencies]
oxframe-protocol.workspace = true
