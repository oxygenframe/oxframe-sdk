name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Projects pin `oxframe = "=0.X.y"` but its own dependencies take the
  # newest 0.X; every earlier release of this minor must build with ours.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1" }
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-semver.sh
        env: { RUSTFLAGS: "" }

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The core, preview and export never depend on drawing (2D, renderers, fonts).
      - run: ./scripts/check-layering.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Video nodes decode with ffmpeg; the video example and tests need it.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --workspace
      - run: cargo clippy -p oxframe --all-targets --features video,unstable-node-api,icons,3d -- -D warnings
      - run: cargo test -p oxframe --features video --lib video
      # Typst math is off by default (and never in the playground).
      - run: cargo clippy -p oxframe-examples --all-targets --features math -- -D warnings
      - run: cargo test -p oxframe-2d --features math --lib math
      # Acceptance numbers (seek ≤ 100 ms) are only meaningful optimized.
      - run: cargo test --release -p oxframe-examples --test acceptance
        env: { OXFRAME_SEEK_BUDGET_MS: "400" }
      - name: wasm32 build
        run: cargo build --target wasm32-unknown-unknown -p oxframe-core -p oxframe-2d -p oxframe-render -p oxframe-protocol -p oxframe
      # The browser engine (playground) is only compiled with the `wasm` feature.
      - name: wasm32 build of the browser engine
        run: cargo clippy --target wasm32-unknown-unknown -p oxframe --features wasm -- -D warnings
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: TypeScript bindings
        run: cargo test -p oxframe-protocol --features ts

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  bench:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p oxframe-examples --bench seek

  # The CPU renderer must draw the same bytes everywhere: frame hashes
  # recorded on Linux x86_64 (examples/tests/frame-hashes.json), checked on
  # the other systems and architectures.
  frame-hashes:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p oxframe-examples --test frame_hashes

  os-matrix:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
