[package]
name = "oxframe"
description = "Motion graphics and video from Rust, built for AI agents: native deterministic rendering, a storyboard-and-report check the agent reads, and an MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/oxframe"
readme = "../../README.md"

[package.metadata.docs.rs]
features = ["icons", "3d", "math", "unstable-node-api"]

[features]
default = ["gpu"]
# wasm-bindgen API for running a project in the browser (playground).
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:console_error_panic_hook"]
# vello renderer for `render` and `preview` (falls back to the CPU renderer
# at runtime when no adapter is available).
gpu = ["oxframe-render/gpu"]
# `#[derive(Node)]` and `Draw` for nodes of your own. The API may change
# until it has outside users.
unstable-node-api = []
# `Video` nodes decode their clips with ffmpeg (native only).
video = []
# `icon!("lucide:server")`: Lucide, Tabler and Simple Icons. Only the icons
# a project names end up in its binary.
icons = ["dep:oxframe-icons"]
# 3D scenes shown in the 2D scene with `View3d` (software renderer, also in
# the browser).
3d = ["dep:oxframe-3d"]
# `Math::new("x^2")`: formulas set by Typst, native only for now. Adds the
# Typst compiler and a 1.4 MB font, so the playground does not enable it.
math = ["oxframe-2d/math"]

[dependencies]
oxframe-core.workspace = true
oxframe-2d.workspace = true
oxframe-components.workspace = true
oxframe-text.workspace = true
oxframe-render.workspace = true
oxframe-protocol.workspace = true
oxframe-macros.workspace = true
oxframe-icons = { workspace = true, optional = true }
oxframe-3d = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
oxframe-preview.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["OffscreenCanvas"], optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxframe-export.workspace = true
flate2 = "1"
oxframe-preview = { workspace = true, features = ["server"] }

[lints]
workspace = true
