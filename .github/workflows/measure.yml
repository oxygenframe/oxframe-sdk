name: measure
# The timings on oxframe.dev/benchmarks, on machines other than the one they
# were first taken on: scripts/measure.sh on GitHub's runners at every
# release. The site picks the results up with
# `bun scripts/machines.ts <run id>` (oxframe-web/apps/site).
on:
  push: { tags: ['v*'] }
  workflow_dispatch:

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # measure.sh builds the CLI next to this repo.
      - uses: actions/checkout@v7
        with: { repository: oxygenframe/oxframe-cli, path: oxframe-cli }
      - run: mv oxframe-cli ../oxframe-cli
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.97.1' }
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - run: RUNS=5 ./scripts/measure.sh > measure-${{ matrix.name }}.json
      - run: cat measure-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: measure-${{ matrix.name }}
          path: measure-${{ matrix.name }}.json
