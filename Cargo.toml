[workspace]
resolver = "3"
members = ["crates/*", "examples"]

[workspace.package]
version = "0.23.9"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxygenframe/oxframe-sdk"
homepage = "https://oxframe.dev"
keywords = ["animation", "video", "motion-graphics", "agents", "mcp"]
categories = ["graphics", "multimedia::video", "rendering"]

[workspace.dependencies]
oxframe-core = { path = "crates/oxframe-core", version = "0.23.9" }
oxframe-2d = { path = "crates/oxframe-2d", version = "0.23.9" }
oxframe-render = { path = "crates/oxframe-render", version = "0.23.9" }
oxframe-text = { path = "crates/oxframe-text", version = "0.23.9" }
oxframe-export = { path = "crates/oxframe-export", version = "0.23.9" }
oxframe-preview = { path = "crates/oxframe-preview", version = "0.23.9", default-features = false }
oxframe-protocol = { path = "crates/oxframe-protocol", version = "0.23.9" }
oxframe-macros = { path = "crates/oxframe-macros", version = "0.23.9" }
oxframe-icons = { path = "crates/oxframe-icons", version = "0.23.9" }
oxframe-3d = { path = "crates/oxframe-3d", version = "0.23.9" }
oxframe-math = { path = "crates/oxframe-math", version = "0.23.9" }
oxframe = { path = "crates/oxframe", version = "0.23.9" }
oxframe-components = { path = "crates/oxframe-components", version = "0.23.9" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
kurbo = "0.13"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
ts-rs = "12"
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
parley = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
usvg = { version = "0.48", default-features = false }
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
vello = "0.11"
pollster = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
criterion = { version = "0.8", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "isomp4", "aac", "flac"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Full debug info made each test binary 0.5–0.9 GB; writing those on every
# rebuild pushed the machine into memory pressure. Line tables keep panic
# locations and backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.bench]
debug = false
