name: release video

# Renders the release notes of every oxframe release as a video with
# oxygenframe/release-video-action and attaches it to the GitHub release.
# The release is created by the `release` workflow with GITHUB_TOKEN, which
# does not start `on: release` workflows; `workflow_run` does start.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.20.0
        required: true

jobs:
  video:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: oxygenframe/release-video-action@v1
        with:
          tag: ${{ inputs.tag || github.event.workflow_run.head_branch }}
